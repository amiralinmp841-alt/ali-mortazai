<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تخمین رتبه</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background: #f5f7fb;

            color: #222;
        }

        .container {
            width: 100%;
            max-width: 500px;

            margin: 0 auto;

            padding: 25px 18px;
        }

        .card {
            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            margin-top: 0;

            font-size: 25px;
        }

        .description {
            color: #666;

            line-height: 2;

            font-size: 15px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 12px;

            margin-top: 20px;
        }

        .field {
            width: 100%;

            border: 1px solid #ddd;

            border-radius: 14px;

            padding: 15px;

            font-size: 16px;

            outline: none;

            background: #fafafa;

            transition: 0.2s;
        }

        .field:focus {
            border-color: #2196f3;

            background: white;
        }

        .button {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 15px;

            margin-top: 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #2196f3;

            color: white;

            transition: 0.2s;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .choices {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 20px;
        }

        .choice {
            border: 2px solid #e5e7eb;

            background: white;

            border-radius: 14px;

            padding: 14px 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .choice.active {
            border-color: #2196f3;

            background: #eaf5ff;

            color: #1976d2;
        }

        .choice.disabled {
            opacity: 0.45;

            cursor: not-allowed;

            background: #f3f4f6;
        }

        .region-choices {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 20px;
        }

        .region-button {
            border: none;

            border-radius: 14px;

            padding: 16px 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background: #eef2f7;

            color: #333;

            transition: 0.2s;
        }

        .region-button:hover {
            background: #dceeff;
        }

        .result-box {
            margin-top: 20px;

            padding: 20px;

            border-radius: 16px;

            background: #f0f8ff;
        }

        .rank-number {
            font-size: 32px;

            font-weight: bold;

            color: #1976d2;

            margin: 10px 0;
        }

        .range {
            font-size: 17px;

            font-weight: bold;

            color: #333;

            margin-top: 15px;
        }

        .info {
            margin-top: 15px;

            font-size: 14px;

            line-height: 2;

            color: #666;
        }

        .error {
            color: #e53935;

            font-size: 14px;

            margin-top: 12px;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>
                🎯 تخمین رتبه
            </h1>


            <!-- مرحله انتخاب رشته -->

            <div
                class="step active"
                id="stepSubject"
            >

                <p class="description">
                    ابتدا رشته خود را انتخاب کنید
                </p>

                <div class="choices">

                    <button
                        class="choice active"
                        id="biologyButton"
                        onclick="selectSubject('تجربی')"
                    >
                        تجربی
                    </button>

                    <button
                        class="choice disabled"
                        disabled
                    >
                        ریاضی
                    </button>

                    <button
                        class="choice disabled"
                        disabled
                    >
                        انسانی
                    </button>

                </div>

                <button
                    class="button"
                    onclick="goToScores()"
                >
                    ادامه
                </button>

            </div>


            <!-- مرحله ورود تراز -->

            <div
                class="step"
                id="stepScores"
            >

                <p class="description">
                    تراز نهایی و کنکور خود را وارد کنید
                </p>

                <div class="fields">

                    <input
                        type="number"
                        class="field"
                        id="finalScore"
                        placeholder="تراز نهایی"
                    >

                    <input
                        type="number"
                        class="field"
                        id="examScore"
                        placeholder="تراز کنکور"
                    >

                </div>

                <div
                    class="error"
                    id="scoreError"
                ></div>

                <button
                    class="button"
                    onclick="confirmScores()"
                >
                    تأیید
                </button>

            </div>


            <!-- مرحله انتخاب منطقه -->

            <div
                class="step"
                id="stepRegion"
            >

                <p class="description">
                    منطقه شما چند است؟
                </p>

                <div class="region-choices">

                    <button
                        class="region-button"
                        onclick="calculateRank(1)"
                    >
                        منطقه ۱
                    </button>

                    <button
                        class="region-button"
                        onclick="calculateRank(2)"
                    >
                        منطقه ۲
                    </button>

                    <button
                        class="region-button"
                        onclick="calculateRank(3)"
                    >
                        منطقه ۳
                    </button>

                </div>

            </div>


            <!-- نتیجه -->

            <div
                class="step"
                id="stepResult"
            >

                <p class="description">
                    نتیجه تخمین رتبه شما
                </p>

                <div class="result-box">

                    <div>
                        تراز میانگین شما
                    </div>

                    <div
                        class="rank-number"
                        id="averageScoreResult"
                    >
                    </div>

                    <div
                        class="range"
                        id="rangeResult"
                    >
                    </div>

                </div>

                <p
                    class="info"
                    id="regionResult"
                ></p>

                <button
                    class="button"
                    onclick="restart()"
                >
                    محاسبه مجدد
                </button>

            </div>

        </div>

    </div>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();


        let selectedSubject = "تجربی";

        let finalScore = 0;

        let examScore = 0;

        let averageScore = 0;


        /*
        داده‌ها به این شکل هستند:

        score = تراز

        rank = رتبه متناظر

        range = بازه‌ای که برای حرکت
        از این نقطه به نقطه بعدی استفاده می‌شود
        */


        const rankData = {


            1: [

                {
                    score: 11800,
                    rank: 1,
                    range: 10
                },

                {
                    score: 11000,
                    rank: 100,
                    range: 50
                },

                {
                    score: 10500,
                    rank: 200,
                    range: 100
                },

                {
                    score: 10000,
                    rank: 500,
                    range: 250
                },

                {
                    score: 9400,
                    rank: 2000,
                    range: 500
                },

                {
                    score: 8700,
                    rank: 5000,
                    range: 1000
                },

                {
                    score: 8000,
                    rank: 10000,
                    range: 2500
                },

                {
                    score: 6800,
                    rank: 20000,
                    range: 2500
                },

                {
                    score: 6000,
                    rank: 30000,
                    range: 5000
                },

                {
                    score: 5000,
                    rank: 45000,
                    range: 5000
                },

                {
                    score: 4000,
                    rank: 60000,
                    range: 5000
                }

            ],


            2: [

                {
                    score: 11700,
                    rank: 1,
                    range: 10
                },

                {
                    score: 11500,
                    rank: 20,
                    range: 20
                },

                {
                    score: 11000,
                    rank: 100,
                    range: 50
                },

                {
                    score: 10500,
                    rank: 300,
                    range: 200
                },

                {
                    score: 10000,
                    rank: 1000,
                    range: 300
                },

                {
                    score: 9500,
                    rank: 2000,
                    range: 500
                },

                {
                    score: 9000,
                    rank: 5000,
                    range: 1000
                },

                {
                    score: 8500,
                    rank: 10000,
                    range: 2000
                },

                {
                    score: 7700,
                    rank: 20000,
                    range: 2000
                },

                {
                    score: 7200,
                    rank: 30000,
                    range: 4000
                },

                {
                    score: 6700,
                    rank: 40000,
                    range: 5000
                },

                {
                    score: 5900,
                    rank: 60000,
                    range: 8000
                },

                {
                    score: 5000,
                    rank: 90000,
                    range: 10000
                },

                {
                    score: 4500,
                    rank: 110000,
                    range: 10000
                }

            ],


            3: [

                {
                    score: 11100,
                    rank: 1,
                    range: 10
                },

                {
                    score: 11000,
                    rank: 20,
                    range: 10
                },

                {
                    score: 10700,
                    rank: 100,
                    range: 50
                },

                {
                    score: 10000,
                    rank: 400,
                    range: 250
                },

                {
                    score: 9500,
                    rank: 1000,
                    range: 250
                },

                {
                    score: 9200,
                    rank: 2000,
                    range: 500
                },

                {
                    score: 9000,
                    rank: 3000,
                    range: 500
                },

                {
                    score: 8700,
                    rank: 5000,
                    range: 1000
                },

                {
                    score: 8000,
                    rank: 10000,
                    range: 2000
                },

                {
                    score: 7300,
                    rank: 20000,
                    range: 3000
                },

                {
                    score: 6300,
                    rank: 40000,
                    range: 5000
                },

                {
                    score: 5500,
                    rank: 70000,
                    range: 10000
                },

                {
                    score: 4900,
                    rank: 100000,
                    range: 10000
                }

            ]

        };


        function showStep(stepId) {

            const steps =
                document.querySelectorAll(".step");


            steps.forEach(function(step) {

                step.classList.remove("active");

            });


            document
                .getElementById(stepId)
                .classList.add("active");

        }


        function selectSubject(subject) {

            if (subject !== "تجربی") {
                return;
            }


            selectedSubject = subject;


            document
                .getElementById("biologyButton")
                .classList.add("active");

        }


        function goToScores() {

            showStep("stepScores");

        }


        function confirmScores() {

            const finalInput =
                document.getElementById("finalScore");

            const examInput =
                document.getElementById("examScore");

            const error =
                document.getElementById("scoreError");


            finalScore =
                Number(finalInput.value);

            examScore =
                Number(examInput.value);


            if (
                !finalScore ||
                !examScore ||
                finalScore < 0 ||
                examScore < 0
            ) {

                error.innerText =
                    "لطفاً هر دو تراز را به‌درستی وارد کنید.";

                return;

            }


            error.innerText = "";


            /*
            ۶۰ درصد نهایی
            ۴۰ درصد کنکور
            */

            averageScore =
                (finalScore * 0.60) +
                (examScore * 0.40);


            showStep("stepRegion");

        }


        function interpolate(
            value,
            value1,
            result1,
            value2,
            result2
        ) {

            return (
                result1 +

                (
                    (value - value1) /

                    (value2 - value1)
                )

                *

                (result2 - result1)
            );

        }


        function calculateRank(region) {

            const data =
                rankData[region];


            let estimatedRank = 0;

            let estimatedRange = 0;


            /*
            اگر تراز از بالاترین داده بیشتر باشد
            */

            if (
                averageScore >= data[0].score
            ) {

                estimatedRank =
                    data[0].rank;

                estimatedRange =
                    data[0].range;

            }


            /*
            اگر تراز از پایین‌ترین داده کمتر باشد
            */

            else if (
                averageScore <=
                data[data.length - 1].score
            ) {

                const last =
                    data[data.length - 1];

                estimatedRank =
                    last.rank;

                estimatedRange =
                    last.range;

            }


            /*
            پیدا کردن بازه مناسب
            */

            else {

                for (
                    let i = 0;
                    i < data.length - 1;
                    i++
                ) {

                    const current =
                        data[i];

                    const next =
                        data[i + 1];


                    if (

                        averageScore <= current.score

                        &&

                        averageScore >= next.score

                    ) {


                        /*
                        محاسبه رتبه با
                        درون‌یابی خطی
                        */

                        estimatedRank =
                            interpolate(

                                averageScore,

                                current.score,
                                current.rank,

                                next.score,
                                next.rank

                            );


                        /*
                        محاسبه بازه رتبه

                        بازه بین دو نقطه
                        به صورت تدریجی
                        تغییر می‌کند
                        */

                        estimatedRange =
                            interpolate(

                                averageScore,

                                current.score,
                                current.range,

                                next.score,
                                next.range

                            );


                        break;

                    }

                }

            }


            estimatedRank =
                Math.round(estimatedRank);


            estimatedRange =
                Math.round(estimatedRange);


            const minRank =
                Math.max(
                    1,
                    estimatedRank -
                    estimatedRange
                );


            const maxRank =
                estimatedRank +
                estimatedRange;


            document
                .getElementById(
                    "averageScoreResult"
                )
                .innerText =
                Math.round(
                    averageScore
                )
                .toLocaleString("fa-IR");


            document
                .getElementById(
                    "rankResult"
                )
                .innerText =
                estimatedRank
                .toLocaleString("fa-IR");


            document
                .getElementById(
                    "rangeResult"
                )
                .innerText =
                "بازه احتمالی رتبه: " +

                minRank
                    .toLocaleString("fa-IR")

                +

                " تا "

                +

                maxRank
                    .toLocaleString("fa-IR");


            document
                .getElementById(
                    "regionResult"
                )
                .innerText =
                "منطقه " +
                region +
                " | رشته " +
                selectedSubject;


            showStep("stepResult");


            sendResultData(
                region,
                estimatedRank,
                minRank,
                maxRank
            );

        }


        function sendResultData(
            region,
            rank,
            minRank,
            maxRank
        ) {

            const data = {

                type: "rank",

                subject:
                    selectedSubject,

                region:
                    region,

                final_score:
                    finalScore,

                exam_score:
                    examScore,

                average_score:
                    Math.round(averageScore),

                estimated_rank:
                    rank,

                min_rank:
                    minRank,

                max_rank:
                    maxRank

            };


            /*
            فقط اگر داخل
            Telegram WebApp باشد
            */

            if (
                tg &&
                tg.sendData
            ) {

                /*
                فعلاً کامنت شده چون
                sendData معمولاً WebApp
                را می‌بندد.

                اگر خواستی نتیجه برای
                ربات ارسال شود، کامنت را بردار.
                */

                // tg.sendData(
                //     JSON.stringify(data)
                // );

            }

        }


        function restart() {

            document
                .getElementById("finalScore")
                .value = "";

            document
                .getElementById("examScore")
                .value = "";


            document
                .getElementById("scoreError")
                .innerText = "";


            finalScore = 0;

            examScore = 0;

            averageScore = 0;


            showStep("stepSubject");

        }

    </script>

</body>

</html>
